# ONE-OFF: persistent Android signing keystore বানানোর জন্য।
# চালু করার পর run log থেকে KEYSTORE_BASE64 বের করে ৪টি secret বসানো হবে,
# তারপর এই ফাইলটি মুছে দেওয়া হবে।
name: Generate Android signing keystore (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keytool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate PKCS12 keystore
        run: |
          ALIAS=hishab
          PASS='Hishab@2026Release'
          keytool -genkeypair -v \
            -keystore hishab-release.jks \
            -alias "$ALIAS" \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Hishab Daily, OU=Mobile, O=Hishab, L=Dhaka, ST=Dhaka, C=BD"
          echo "===KEYSTORE_BASE64_START==="
          base64 -w 0 hishab-release.jks
          echo ""
          echo "===KEYSTORE_BASE64_END==="
          echo "alias=$ALIAS · storepass/keypass=Hishab@2026Release"
